<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2F6F5E" />
    <title>You're offline — ElderSphere</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #F7F3EC;
        color: #1A2420;
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #10201B; color: #F1EFE8; }
      }
      .card {
        max-width: 420px;
        text-align: center;
      }
      .badge {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: #2F6F5E;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
        font-size: 32px;
      }
      h1 { font-size: 22px; font-weight: 800; margin: 0 0 8px; }
      p { font-size: 15px; line-height: 1.5; color: inherit; opacity: 0.75; margin: 0 0 24px; }
      button {
        appearance: none;
        border: none;
        border-radius: 10px;
        padding: 12px 24px;
        font-size: 15px;
        font-weight: 700;
        font-family: inherit;
        background: #2F6F5E;
        color: #fff;
        cursor: pointer;
      }
      button:hover { background: #1F4F42; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">&#9825;</div>
      <h1>You're offline</h1>
      <p>ElderSphere can't reach the server right now. Check your connection and try again — anything you were viewing will still be here.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
